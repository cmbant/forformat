[package]
name = "forformat"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A standalone free-form Fortran formatter"
license = "BSD-3-Clause"

[lib]
name = "forformat"
path = "src/lib.rs"

[[bin]]
name = "forformat"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bench]]
name = "throughput"
harness = false

[dev-dependencies]
