[package]
name = "forformat"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
description = "A standalone free-form Fortran formatter"
license = "BSD-3-Clause"
repository = "https://github.com/cmbant/forformat"

# An explicit allow-list, not an `exclude`. Listing what ships prevents a new
# scratch directory from silently joining the package archive.
#
# `include` bypasses .gitignore rather than composing with it, so these are
# matched by extension: a bare `/tools/**` re-admits the `__pycache__/*.pyc`
# that .gitignore was keeping out.
include = [
    "/src/**/*.rs",
    "/benches/**/*.rs",
    "/tests/**/*.rs",
    "/tests/**/*.f90",
    "/tests/**/*.out",
    "/tests/**/*.manifest",
    "/tests/**/*.json",
    "/tools/**/*.py",
    "/tools/**/*.sh",
    "/tools/**/*.md",
    "/docs/**/*.md",
    "/forformat/**/*.py",
    "/forformat_runner/**/*.py",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/README_PYPI.md",
    "/LICENSE",
    "/LICENSE-THIRD-PARTY",
    "/NOTICE",
    "/pyproject.toml",
    "/setup.py",
]

[lib]
name = "forformat"
path = "src/lib.rs"

[[bin]]
name = "forformat"
path = "src/main.rs"

[dependencies]
toml = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bench]]
name = "throughput"
harness = false

[dev-dependencies]
