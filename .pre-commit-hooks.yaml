- id: forformat
  name: Format free-form Fortran
  description: Format free-form Fortran files in place with forformat.
  entry: forformat
  language: python
  files: (?i)\.(?:f03|f08|f18|f23|f90|f95)$
  types_or: [text]
  pass_filenames: true

- id: forformat-check
  name: Check free-form Fortran formatting
  description: Check free-form Fortran formatting with forformat.
  entry: forformat --check
  language: python
  files: (?i)\.(?:f03|f08|f18|f23|f90|f95)$
  types_or: [text]
  pass_filenames: true
