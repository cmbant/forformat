name: Consolidate PR20 conditional continuations

on:
  pull_request:

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/conditional-continuation-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/conditional-continuation-state
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Apply contextual consolidation
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/consolidate_pr20.py
          python /tmp/consolidate_pr20.py
          cargo fmt --all
          git diff --check
          if rg -n 'SourceStream::from\(' src; then
            echo 'shape-to-stream conversion remains' >&2
            exit 1
          fi
          git rm .github/workflows/consolidate-pr20.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/format/emitter.rs src/format/full.rs src/source/buffer.rs src/source/regions.rs src/source/syntax.rs src/transform/passes/conditional_continuations.rs src/transform/passes/continuations.rs src/transform/passes/layout_post/alignment.rs src/transform/passes/line_rules/mod.rs src/transform/pipeline.rs tests/conditional_compilation.rs
          git commit -m 'Consolidate contextual conditional continuation handling'
          git push origin HEAD:fix/conditional-continuation-state
