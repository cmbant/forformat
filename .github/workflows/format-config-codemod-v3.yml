name: FormatConfig staging codemod v3

on:
  push:
    branches:
      - refactor/format-config-staging

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/format-config-staging
          fetch-depth: 0

      - name: Apply hardened cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          # v2's only remaining fragile matches are indentation-only. Normalize
          # those snippets before reusing the already-reviewed transformation.
          path = Path('src/io/report.rs')
          text = path.read_text()
          text = text.replace(
              '    !invocation.force_free_input\n        && !invocation.config.last_indent\n        && !invocation.config.last_usable\n',
              '    !invocation.force_free_input\n    && !invocation.config.last_indent\n    && !invocation.config.last_usable\n',
              1,
          )
          path.write_text(text)

          path = Path('src/io/mod.rs')
          text = path.read_text()
          text = text.replace(
              '    if invocation.query_format {\n        return execute_query_format(invocation);\n    }\n',
              '    if invocation.query_format {\n    return execute_query_format(invocation);\n}\n',
              1,
          )
          path.write_text(text)

          # One FormatConfig test constructor uses bool field shorthand. The
          # new FeatureLevel field needs an explicit conversion there.
          path = Path('tests/canonicalize_rewrap.rs')
          text = path.read_text()
          old = '                ws_remred,\n                ..FormatConfig::default()\n'
          assert old in text
          text = text.replace(
              old,
              '                ws_remred: ws_remred.into(),\n                ..FormatConfig::default()\n',
              1,
          )
          path.write_text(text)

          workflow = Path('.github/workflows/format-config-codemod-v2.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n          PY\n', start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<format-config-codemod-v2>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Format
        run: cargo fmt --all

      - name: Check
        run: cargo check --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

      - name: Commit validated staging tree
        shell: bash
        run: |
          rm -f .github/workflows/format-config-codemod.yml
          rm -f .github/workflows/format-config-codemod-v2.yml
          rm -f .github/workflows/format-config-codemod-v3.yml
          rm -f .github/format-config-staging-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage validated FormatConfig cleanup'
          git push origin HEAD:refactor/format-config-staging
