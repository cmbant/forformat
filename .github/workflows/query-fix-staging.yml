name: Query fix staging

on:
  push:
    branches:
      - refactor/query-fix-staging

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.85.0'
          components: rustfmt
      - name: Apply query-path cleanup
        run: python3 .github/query_fix.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked --all-targets
      - name: Commit validated staging tree
        shell: bash
        run: |
          rm .github/query_fix.py .github/workflows/query-fix-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage validated indentation-query fix'
          git push origin HEAD:refactor/query-fix-staging
