name: Finalize current-main integration in PR18

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/conditional-continuation-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/conditional-continuation-state
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Restore current-main changes and resolve overlaps
        shell: bash
        run: |
          set -euo pipefail
          base=14b438780e4746ebd73be4802a021d96fcbc2e02
          main=b9b296387f68975403193923446d6b1cda40826b

          git checkout "$main" -- \
            docs/migration.md \
            docs/options.md \
            src/cli/options.rs \
            src/cli/parse/long.rs \
            src/config.rs \
            src/transform/document.rs \
            src/transform/passes/canonical_end.rs \
            src/transform/passes/line_rules/case.rs \
            src/transform/passes/line_rules/keyword_spacing.rs \
            src/transform/passes/rewrap.rs \
            tests/canonicalize_rewrap.rs \
            tests/config_wrap_policy.rs \
            tests/reduce_whitespace_config.rs \
            tests/reduce_whitespace_option.rs

          for path in \
            src/transform/passes/line_rules/mod.rs \
            src/transform/passes/mod.rs
          do
            patch="/tmp/$(basename "$path").patch"
            git diff "$base" "$main" -- "$path" > "$patch"
            git apply --3way "$patch"
          done

          pipeline=src/transform/pipeline.rs
          git diff "$base" "$main" -- "$pipeline" > /tmp/pipeline.patch
          set +e
          git apply --3way /tmp/pipeline.patch
          pipeline_status=$?
          set -e
          if [[ $pipeline_status -ne 0 ]]; then
            python - <<'PY'
          from pathlib import Path

          path = Path('src/transform/pipeline.rs')
          text = path.read_text()
          assert text.count('<<<<<<< ours\n') == 1
          assert text.count('=======\n') == 1
          assert text.count('>>>>>>> theirs\n') == 1
          start = text.index('<<<<<<< ours\n')
          middle = text.index('=======\n', start)
          end_marker = '>>>>>>> theirs\n'
          end = text.index(end_marker, middle) + len(end_marker)
          ours = text[start + len('<<<<<<< ours\n'):middle]
          theirs = text[middle + len('=======\n'):text.index(end_marker, middle)]
          ours = ours.replace(
              'let mut changed = if config.style.continuation_markers {',
              'let mut changed = if normalize_whitespace && config.style.continuation_markers {',
          )
          assert 'normalize_whitespace && config.style.continuation_markers' in ours
          combined = theirs.rstrip() + '\n\n' + ours
          text = text[:start] + combined + text[end:]
          assert '<<<<<<<' not in text and '>>>>>>>' not in text
          path.write_text(text)
          PY
            git add "$pipeline"
          fi

          cargo fmt --all
          git diff --check
          cargo check --locked

      - name: Commit integrated tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-main-integration-pr18.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate current main policies with conditional continuations'
          git push origin HEAD:fix/conditional-continuation-state
