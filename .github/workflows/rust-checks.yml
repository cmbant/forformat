name: Reusable Rust correctness checks

on:
  workflow_call:

jobs:
  fast-checks:
    name: ${{ matrix.check }} (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      # Let every fast check report its result before the expensive checks are
      # considered. The checks job below is the failure gate.
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", stable]
        check: [fmt, clippy]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.check == 'fmt' && 'rustfmt' || 'clippy' }}
      - name: Check formatting
        if: matrix.check == 'fmt'
        run: cargo fmt --check
      - name: Run Clippy
        if: matrix.check == 'clippy'
        run: CARGO_TARGET_DIR=/tmp/forformat-lint cargo clippy --locked --all-targets -- -D warnings

  checks:
    name: checks (Rust ${{ matrix.toolchain }})
    needs: fast-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - run: cargo test --locked --all-targets
      - run: ./tools/check_fixture_syntax.sh target/debug/forformat
      - run: ./tools/check_fuzz_regression.sh
      - run: ./tools/check_cli_contract.sh target/debug/forformat
      - run: ./tools/check_docs.sh target/debug/forformat
