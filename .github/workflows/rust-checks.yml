name: Reusable Rust correctness checks

on:
  workflow_call:

jobs:
  fast-checks:
    name: ${{ matrix.check }} (Rust stable)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, clippy]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: ${{ matrix.check == 'fmt' && 'rustfmt' || 'clippy' }}
      - name: Check formatting
        if: matrix.check == 'fmt'
        run: cargo fmt --check
      - name: Run Clippy
        if: matrix.check == 'clippy'
        run: CARGO_TARGET_DIR=/tmp/forformat-lint cargo clippy --locked --all-targets -- -D warnings
      # The fuzz targets are a separate workspace, so neither command above
      # reaches them.
      - name: Check fuzz target formatting
        if: matrix.check == 'fmt'
        run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - name: Run Clippy on the fuzz targets
        if: matrix.check == 'clippy'
        run: |
          CARGO_TARGET_DIR=/tmp/forformat-fuzz-lint cargo clippy --locked \
            --manifest-path fuzz/Cargo.toml \
            --target "$(rustc -vV | sed -n 's/^host: //p')" \
            --all-targets -- -D warnings

  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check dependency bans, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.85.0"
          command: check bans licenses sources

  dependency-advisories:
    name: dependency advisories
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Check RustSec advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.85.0"
          command: check advisories

  checks:
    name: checks (Rust ${{ matrix.toolchain }})
    needs: fast-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - run: cargo test --locked --all-targets
      # `--all-targets` excludes doctests, so the public-API examples in the
      # rustdoc need their own run or they are never compiled.
      - run: cargo test --locked --doc
      - run: ./tools/check_fixture_syntax.sh target/debug/forformat
      - run: ./tools/check_fuzz_regression.sh
      - run: ./tools/check_cli_contract.sh target/debug/forformat
      - run: ./tools/check_docs.sh target/debug/forformat

  # The `checks` job above runs the fuzz targets over a fixed corpus, which is
  # reproducible but only ever sees inputs someone already thought of. This job
  # runs the mutation loop, which is where new inputs actually come from.
  #
  # It is non-blocking, and deliberately short. A failure here is never a false
  # alarm -- the crashing input is uploaded and reproduces exactly -- but it is
  # often not the PR's fault either: the loop's job is to keep finding
  # long-standing defects, and gating merges on it means red builds for bugs the
  # PR did not introduce. A clean campaign is a property of the corpus and the
  # seed, not of the formatter.
  #
  # 60s total across all targets is chosen to keep CI fast, which means each run
  # is a sample, not a verdict. Treat a red run here as a bug report worth
  # reducing, not as a gate; a real campaign is
  # `FUZZ_TIME=<large> ./tools/check_fuzz_regression.sh` run locally.
  fuzz:
    name: fuzz (mutating, non-blocking)
    needs: fast-checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      # 60s total across all targets, plus the instrumented build.
      - run: FUZZ_TIME=60 ./tools/check_fuzz_regression.sh
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Wheels are published for Windows and macOS, so the test suite has to run
  # there and not just compile. The shell-script checks above stay on Linux;
  # this job covers the Rust behaviour that differs by platform -- path
  # handling, line endings, and the in-place atomic replace.
  platform-tests:
    name: tests (${{ matrix.os }})
    needs: fast-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
