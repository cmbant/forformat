name: Reusable Rust correctness checks

on:
  workflow_call:

jobs:
  checks:
    name: checks (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v5
      - name: Apply staged review fix
        run: |
          base64 -d .review-fix2.patch.gz.b64 | gzip -d | git apply
          python - <<'PY'
          from pathlib import Path
          p=Path('src/analysis/declarations/extract.rs'); s=p.read_text().replace('    let Some(first) = tokens.iter().position(|token| token.kind != TokenKind::Number) else {\n        return;\n    };','    let Some(first) = tokens\n        .iter()\n        .position(|token| token.kind != TokenKind::Number)\n    else {\n        return;\n    };').replace('    let member_access = unit.member_access.entry(owner.to_ascii_lowercase()).or_default();','    let member_access = unit\n        .member_access\n        .entry(owner.to_ascii_lowercase())\n        .or_default();'); p.write_text(s)
          p=Path('src/analysis/declarations/units.rs'); s=p.read_text().replace('            self.member_access.entry(owner.clone()).or_default().merge(access);','            self.member_access\n                .entry(owner.clone())\n                .or_default()\n                .merge(access);'); p.write_text(s)
          p=Path('src/analysis/declarations.rs'); s=p.read_text().replace('pub(crate) use units::{Accessibility, HostAccess, HostUnit, ModuleNature, UnitFacts, UseAssociation, UseName};','pub(crate) use units::{\n    Accessibility, HostAccess, HostUnit, ModuleNature, UnitFacts, UseAssociation, UseName,\n};'); p.write_text(s)
          p=Path('src/analysis/project/visibility.rs'); s=p.read_text().replace('Accessibility, FileFacts, HostUnit, UnitFacts, ModuleNature, UseAssociation','Accessibility, FileFacts, HostUnit, ModuleNature, UnitFacts, UseAssociation'); p.write_text(s)
          p=Path('src/io/mod.rs'); s=p.read_text().replace('    analysis::{analyze_file, analyze_file_at}, cli::Invocation, error::FormatError, format_source, source::SourceForm,','    analysis::{analyze_file, analyze_file_at},\n    cli::Invocation,\n    error::FormatError,\n    format_source,\n    source::SourceForm,'); p.write_text(s)
          p=Path('src/transform/passes/case_pass.rs'); s=p.read_text().replace('        project::ResolvedType, scoped_declared_names, CaseMap, DeclaredNameIndex, DeclaredSpelling, TypeMaps,','        project::ResolvedType,\n        scoped_declared_names, CaseMap, DeclaredNameIndex, DeclaredSpelling, TypeMaps,').replace('    Symbol { allow_external: bool },','    Symbol {\n        allow_external: bool,\n    },').replace('    UseRemote { module: Vec<u8> },','    UseRemote {\n        module: Vec<u8>,\n    },').replace('        if let Some(type_name) =\n            designator_type(selector, procedure, cx.local, Some(&cx.project.types), outer)\n        {','        if let Some(type_name) = designator_type(\n            selector,\n            procedure,\n            cx.local,\n            Some(&cx.project.types),\n            outer,\n        ) {'); p.write_text(s)
          PY
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: CARGO_TARGET_DIR=/tmp/forformat-lint cargo clippy --locked --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - run: cargo test --locked --all-targets
      - run: ./tools/check_fixture_syntax.sh target/debug/forformat
      - run: ./tools/check_fuzz_regression.sh
      - run: ./tools/check_cli_contract.sh target/debug/forformat
      - run: ./tools/check_docs.sh target/debug/forformat
