name: stdin filename ci fix

on:
  push:
    branches:
      - tmp/stdin-filename-ci-fix

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update help contract expectation
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/--project-context=<path>/--project-context=<directory>/' src/cli/tests.rs
          grep -Fq -- '--project-context=<directory>' src/cli/tests.rs
          ! grep -Fq -- '--project-context=<path>' src/cli/tests.rs
      - name: Commit test update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cli/tests.rs
          git commit -m 'Update project context help contract'
          git push
