name: Publish Python package to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust correctness checks
    uses: ./.github/workflows/rust-checks.yml

  verify-release:
    name: Verify release
    needs: rust-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Verify the tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: ./tools/check_package.sh

  build-wheels:
    name: Build Python wheel (${{ matrix.platform }})
    needs: [rust-checks, verify-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-musl
            wheel_platform_tag: manylinux_2_17_x86_64.musllinux_1_2_x86_64
            cross: true
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-musl
            wheel_platform_tag: manylinux_2_17_aarch64.musllinux_1_2_aarch64
            cross: false
          - os: macos-15-intel
            platform: macos-x86_64
            macos_arch: x86_64
            macos_deployment_target: "10.12"
            wheel_platform_tag: macosx_10_12_x86_64
          - os: macos-15
            platform: macos-arm64
            macos_arch: arm64
            macos_deployment_target: "11.0"
            wheel_platform_tag: macosx_11_0_arm64
          - os: windows-latest
            platform: windows-x86_64
            wheel_platform_tag: win_amd64
          - os: windows-11-arm
            platform: windows-arm64
            wheel_platform_tag: win_arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install cross
        if: matrix.target != '' && matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Install musl toolchain
        if: matrix.target != '' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
      - name: Build release binary
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: |
          if [ -z "${{ matrix.target }}" ]; then
            cargo build --locked --release
          elif [ "${{ matrix.cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi
      - name: Verify macOS binary architecture
        if: matrix.macos_arch != ''
        shell: bash
        run: test "$(lipo -archs target/release/forformat)" = "${{ matrix.macos_arch }}"
      - run: python -m pip install --upgrade build
      - name: Build wheel
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            export FORFORMAT_BINARY="target/${{ matrix.target }}/release/forformat"
          fi
          export FORFORMAT_WHEEL_PLATFORM_TAG="${{ matrix.wheel_platform_tag }}"
          python -m build --wheel --outdir dist
          shopt -s nullglob
          wheel=(dist/*-"${{ matrix.wheel_platform_tag }}".whl)
          test "${#wheel[@]}" -eq 1
      - name: Smoke-test the wheel in a clean environment
        shell: bash
        run: ./tools/check_wheel.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: forformat-wheel-${{ matrix.platform }}
          path: dist/*.whl

  verify-wheel-python39:
    name: Verify Python 3.9 wheel
    needs: [rust-checks, verify-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build release binary
        run: cargo build --locked --release
      - run: python -m pip install --upgrade build
      - name: Build wheel
        env:
          FORFORMAT_BINARY: target/release/forformat
        run: python -m build --wheel --outdir dist
      - name: Smoke-test the wheel under Python 3.9
        run: bash tools/check_wheel.sh dist

  publish:
    name: Publish to PyPI
    needs: [build-wheels, verify-wheel-python39]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/forformat
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: forformat-wheel-*
          path: dist
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
