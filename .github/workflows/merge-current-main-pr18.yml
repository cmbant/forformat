name: Merge current main into PR18

on:
  push:
    branches:
      - fix/conditional-continuation-state

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/conditional-continuation-state
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Merge and replay orthogonal policy changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          for path in "${conflicts[@]}"; do
            case "$path" in
              src/transform/passes/line_rules/mod.rs|src/transform/passes/mod.rs|src/transform/pipeline.rs) ;;
              *) echo "unexpected merge conflict: $path" >&2; exit 1 ;;
            esac
          done

          for path in "${conflicts[@]}"; do
            git checkout --ours -- "$path"
            git add -- "$path"
            git diff 14b438780e4746ebd73be4802a021d96fcbc2e02..origin/main -- "$path" > /tmp/main-overlap.patch
            git apply --3way /tmp/main-overlap.patch
            git add -- "$path"
          done

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'unresolved conflicts remain' >&2
            git diff --cc
            exit 1
          fi
          if [[ $merge_status -ne 0 && ${#conflicts[@]} -eq 0 ]]; then
            echo 'merge failed without an ordinary file conflict' >&2
            exit 1
          fi

          cargo fmt --all
          git diff --check
          git rm .github/workflows/merge-current-main-pr18.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add -- src/transform/passes/line_rules/mod.rs src/transform/passes/mod.rs src/transform/pipeline.rs
          git commit -m 'Merge current main after PR20 consolidation'
          git push origin HEAD:fix/conditional-continuation-state
