name: stdin filename wheel check

on:
  push:
    branches:
      - tmp/stdin-filename-wheel-check

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check build
      - name: Build and check wheel
        run: python -m build --wheel --outdir dist && bash tools/check_wheel.sh dist
