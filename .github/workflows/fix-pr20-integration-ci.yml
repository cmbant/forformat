name: Fix PR20 integration CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/conditional-continuation-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/conditional-continuation-state
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Apply CI cleanups
        shell: python
        run: |
          from pathlib import Path

          full = Path('src/format/full.rs')
          text = full.read_text()
          old = '        source::LogicalGroup,\n'
          new = '        source::{LogicalGroup, SourceBuffer},\n'
          assert text.count(old) == 1
          full.write_text(text.replace(old, new, 1))

          cont = Path('src/transform/passes/continuations.rs')
          text = cont.read_text()
          edits = [
              ('    for index in 0..lines.len() {\n', '    for (index, slot) in previous.iter_mut().enumerate() {\n'),
              ('        previous[index] = *nearest;\n', '        *slot = *nearest;\n'),
              ('    for index in (0..lines.len()).rev() {\n', '    for (index, slot) in next.iter_mut().enumerate().rev() {\n'),
              ('        next[index] = *nearest;\n', '        *slot = *nearest;\n'),
          ]
          for old, new in edits:
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          cont.write_text(text)
      - run: cargo fmt --all && git diff --check
      - name: Commit clean tree
        shell: bash
        run: |
          git rm .github/workflows/fix-pr20-integration-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/format/full.rs src/transform/passes/continuations.rs
          git commit -m 'Fix consolidated continuation CI cleanups'
          git push origin HEAD:fix/conditional-continuation-state
