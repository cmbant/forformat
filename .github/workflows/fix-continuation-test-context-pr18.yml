name: Fix continuation test context in PR18

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/conditional-continuation-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/conditional-continuation-state
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Fix stale continuation test analysis
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/transform/passes/continuations.rs')
          text = path.read_text()

          old = '    let _ = cx;\n    let original = document.lines.clone();\n'
          new = '''    let original = document.lines.clone();
              debug_assert_eq!(
                  original.len(),
                  cx.analysis.buffer.lines.len(),
                  "continuation pass requires analysis of the current document",
              );
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          pattern = re.compile(
              r"    fn cx<'a>\(local: &'a FileFacts, project: &'a ProjectContext\) -> PassContext<'a> \{\n"
              r"\s*let analysis = Box::leak\(Box::new\(Document::from_bytes\(b\"\"\)\.analyze\(\)\.unwrap\(\)\)\);\n"
          )
          replacement = '''    fn cx<'a>(
              document: &Document,
              local: &'a FileFacts,
              project: &'a ProjectContext,
          ) -> PassContext<'a> {
              let analysis = Box::leak(Box::new(document.analyze().unwrap()));
          '''
          text, replaced = pattern.subn(replacement, text, count=1)
          assert replaced == 1, replaced

          anchor = '''        PassContext {
              config,
              project,
              local,
              analysis,
              scopes,
          }
          }

          #[test]
          '''
          helpers = '''        PassContext {
              config,
              project,
              local,
              analysis,
              scopes,
          }
          }

          fn normalize(
              document: &mut Document,
              local: &FileFacts,
              project: &ProjectContext,
          ) -> Result<Changed, crate::error::FormatError> {
              let context = cx(document, local, project);
              normalize_continuations(document, &context)
          }

          fn run_pass(
              document: &mut Document,
              local: &FileFacts,
              project: &ProjectContext,
          ) -> Result<Changed, crate::error::FormatError> {
              let context = cx(document, local, project);
              run(document, &context)
          }

          fn normalize_openmp(
              document: &mut Document,
              local: &FileFacts,
              project: &ProjectContext,
          ) -> Result<Changed, crate::error::FormatError> {
              let context = cx(document, local, project);
              normalize_openmp_continuation_sentinels(document, &context)
          }

          #[test]
          '''
          assert text.count(anchor) == 1
          text = text.replace(anchor, helpers, 1)

          replacements = {
              'normalize_continuations(&mut document, &cx(&local, &project))':
                  'normalize(&mut document, &local, &project)',
              'run(&mut document, &cx(&local, &project))':
                  'run_pass(&mut document, &local, &project)',
              'normalize_openmp_continuation_sentinels(&mut document, &cx(&local, &project))':
                  'normalize_openmp(&mut document, &local, &project)',
          }
          total = 0
          for old_call, new_call in replacements.items():
              count = text.count(old_call)
              total += count
              text = text.replace(old_call, new_call)
          assert total >= 10, total
          assert 'cx(&local, &project)' not in text

          path.write_text(text)
      - name: Validate focused and full tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo test --locked transform::passes::continuations::tests --lib
          cargo test --locked --all-targets
      - name: Commit clean fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-continuation-test-context-pr18.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/transform/passes/continuations.rs
          git commit -m 'Keep continuation test analysis in sync'
          git push origin HEAD:fix/conditional-continuation-state
