name: forformat checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/rust-checks.yml

  release:
    name: release and benchmark
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable@0.7.5
      - run: cargo auditable build --locked --release
      - name: Verify embedded dependency metadata
        shell: bash
        run: readelf -S target/release/forformat | grep -F .dep-v0
      - run: ./tools/check_cli_contract.sh target/release/forformat
      - run: ./tools/check_release.sh target/release/forformat | tee target/release-metrics.txt
      - run: ./tools/check_package.sh
      - run: cargo bench --locked --bench throughput
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-measurements
          path: target/release-metrics.txt

  target-checks:
    name: target check (${{ matrix.target }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - run: cargo check --locked --target ${{ matrix.target }} --all-targets

  static-artifacts:
    name: static Linux artifact (${{ matrix.target }})
    needs: checks
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable@0.7.5

      - name: Verify release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build reproducible binary A
        run: |
          CARGO_TARGET_DIR=target/repro-a \
            cargo auditable build \
            --locked \
            --release \
            --target ${{ matrix.target }}

      - name: Build reproducible binary B
        run: |
          CARGO_TARGET_DIR=target/repro-b \
            cargo auditable build \
            --locked \
            --release \
            --target ${{ matrix.target }}

      - name: Verify auditable and reproducible binary
        shell: bash
        run: |
          set -euo pipefail

          a=target/repro-a/${{ matrix.target }}/release/forformat
          b=target/repro-b/${{ matrix.target }}/release/forformat

          readelf -S "$a" | grep -F .dep-v0
          readelf -S "$b" | grep -F .dep-v0

          test "$(sha256sum "$a" | awk '{print $1}')" = \
               "$(sha256sum "$b" | awk '{print $1}')"

      - name: Package deterministic release archive
        shell: bash
        run: |
          set -euo pipefail

          target=${{ matrix.target }}
          root=target/release-package
          directory="forformat-$target"
          archive="$root/$directory.tar.gz"
          check_archive="$root/$directory.repro.tar.gz"
          source_date_epoch=$(git log -1 --format=%ct)

          mkdir -p "$root/$directory"

          install -m 0755 \
            "target/repro-a/$target/release/forformat" \
            "$root/$directory/forformat"

          cp \
            LICENSE \
            LICENSE-THIRD-PARTY \
            NOTICE \
            README.md \
            "$root/$directory/"

          make_archive() {
            output=$1

            tar \
              --sort=name \
              --mtime="@$source_date_epoch" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C "$root" \
              -cf - "$directory" |
              gzip -n > "$output"
          }

          make_archive "$archive"
          make_archive "$check_archive"

          cmp "$archive" "$check_archive"
          rm "$check_archive"

          (
            cd "$root"
            sha256sum "$(basename "$archive")" \
              > "$(basename "$archive").sha256"
          )

      - uses: actions/upload-artifact@v7
        with:
          name: linux-release-${{ matrix.target }}
          path: |
            target/release-package/forformat-${{ matrix.target }}.tar.gz
            target/release-package/forformat-${{ matrix.target }}.tar.gz.sha256

  windows-artifact:
    name: Windows release artifact
    needs: checks
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      RUSTFLAGS: >-
        -C debuginfo=0
        -C strip=debuginfo
        -C link-arg=/Brepro
        -C link-arg=/DEBUG:NONE
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Build reproducible binary A
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "target/repro-a"
          cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Build reproducible binary B
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "target/repro-b"
          cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Verify reproducible Windows binary
        shell: pwsh
        run: |
          $a = (
            Get-FileHash `
              target/repro-a/x86_64-pc-windows-msvc/release/forformat.exe `
              -Algorithm SHA256
          ).Hash

          $b = (
            Get-FileHash `
              target/repro-b/x86_64-pc-windows-msvc/release/forformat.exe `
              -Algorithm SHA256
          ).Hash

          if ($a -ne $b) {
            throw "reproducible Windows build hash mismatch"
          }

          $artifact =
            "target/repro-a/x86_64-pc-windows-msvc/release/forformat-x86_64-pc-windows-msvc.exe"

          Copy-Item `
            target/repro-a/x86_64-pc-windows-msvc/release/forformat.exe `
            $artifact

          "$a  forformat-x86_64-pc-windows-msvc.exe" |
            Out-File `
              "$artifact.sha256" `
              -Encoding ascii

          Write-Output $a

      - uses: actions/upload-artifact@v7
        with:
          name: forformat-x86_64-pc-windows-msvc
          path: |
            target/repro-a/x86_64-pc-windows-msvc/release/forformat-x86_64-pc-windows-msvc.exe
            target/repro-a/x86_64-pc-windows-msvc/release/forformat-x86_64-pc-windows-msvc.exe.sha256

  macos-artifacts:
    name: macOS release artifact (${{ matrix.target }})
    needs: checks
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            arch: x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build reproducible binary A
        shell: bash
        run: |
          CARGO_TARGET_DIR=target/repro-a \
            cargo build --locked --release --target ${{ matrix.target }}

      - name: Build reproducible binary B
        shell: bash
        run: |
          CARGO_TARGET_DIR=target/repro-b \
            cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify reproducible macOS binary and package it
        shell: bash
        run: |
          set -euo pipefail

          target=${{ matrix.target }}
          a="target/repro-a/$target/release/forformat"
          b="target/repro-b/$target/release/forformat"
          artifact="target/repro-a/$target/release/forformat-$target"

          test "$(shasum -a 256 "$a" | awk '{print $1}')" = \
               "$(shasum -a 256 "$b" | awk '{print $1}')"
          test "$(lipo -archs "$a")" = "${{ matrix.arch }}"

          cp "$a" "$artifact"
          (
            cd "$(dirname "$artifact")"
            shasum -a 256 "$(basename "$artifact")" \
              > "$(basename "$artifact").sha256"
          )

      - uses: actions/upload-artifact@v7
        with:
          name: forformat-${{ matrix.target }}
          path: |
            target/repro-a/${{ matrix.target }}/release/forformat-${{ matrix.target }}
            target/repro-a/${{ matrix.target }}/release/forformat-${{ matrix.target }}.sha256

  artifact-verification:
    name: verify release artifacts
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [static-artifacts, windows-artifact, macos-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-release-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: forformat-x86_64-pc-windows-msvc
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          pattern: forformat-*-apple-darwin
          path: artifacts
          merge-multiple: true

      - name: Verify artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(artifacts/*.tar.gz)
          archive_sidecars=(artifacts/*.tar.gz.sha256)
          binary_sidecars=(artifacts/forformat-*.sha256)

          test "${#archives[@]}" -eq 2
          test "${#archive_sidecars[@]}" -eq 2
          test "${#binary_sidecars[@]}" -eq 3

          (
            cd artifacts
            sha256sum -c ./*.sha256
          )

      - name: Smoke-test x86_64 archive
        shell: bash
        run: |
          set -euo pipefail

          archive=artifacts/forformat-x86_64-unknown-linux-musl.tar.gz
          mkdir -p smoke
          tar -xzf "$archive" -C smoke

          binary=smoke/forformat-x86_64-unknown-linux-musl/forformat
          test -x "$binary"

          expected_version=$(
            sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml |
              head -n 1
          )

          output=$("$binary" --version)

          case "$output" in
            *"$expected_version"*)
              ;;
            *)
              echo \
                "unexpected version output: $output; expected $expected_version" \
                >&2
              exit 1
              ;;
          esac

          readelf -S "$binary" | grep -F .dep-v0

  publish-github-release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: artifact-verification
    runs-on: ubuntu-latest

    # GitHub Settings -> Environments -> release controls this gate.
    environment:
      name: release

    # Never allow two publication jobs to mutate releases concurrently.
    concurrency:
      group: publish-github-release
      cancel-in-progress: false

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-release-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: forformat-x86_64-pc-windows-msvc
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          pattern: forformat-*-apple-darwin
          path: artifacts
          merge-multiple: true

      - name: Re-verify checksums before publishing
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(artifacts/*.tar.gz)
          archive_sidecars=(artifacts/*.tar.gz.sha256)
          binary_sidecars=(artifacts/forformat-*.sha256)

          test "${#archives[@]}" -eq 2
          test "${#archive_sidecars[@]}" -eq 2
          test "${#binary_sidecars[@]}" -eq 3

          (
            cd artifacts
            sha256sum -c ./*.sha256
          )

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/forformat-x86_64-pc-windows-msvc.exe
            artifacts/forformat-x86_64-apple-darwin
            artifacts/forformat-aarch64-apple-darwin

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload \
              "$GITHUB_REF_NAME" \
              artifacts/* \
              --clobber
          else
            gh release create \
              "$GITHUB_REF_NAME" \
              artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "forformat $GITHUB_REF_NAME"
          fi

  publish-pypi:
    name: publish Python package to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: artifact-verification
    uses: ./.github/workflows/pypi.yml
    permissions:
      contents: read
      id-token: write
