name: Rust conversion checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/rust-checks.yml

  release:
    name: release and benchmark
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo build --locked --release
      - run: ./tools/check_cli_contract.sh target/release/forformat
      - run: ./tools/check_release.sh target/release/forformat | tee target/release-metrics.txt
      - run: ./tools/check_package.sh
      - run: cargo bench --locked --bench throughput
      - uses: actions/upload-artifact@v7
        with:
          name: release-measurements
          path: target/release-metrics.txt

  target-checks:
    name: target check (${{ matrix.target }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - run: cargo check --locked --target ${{ matrix.target }} --all-targets

  static-artifacts:
    name: static Linux artifact (${{ matrix.target }})
    needs: checks
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Verify release tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: CARGO_TARGET_DIR=target/repro-a cross build --locked --release --target ${{ matrix.target }}
      - run: CARGO_TARGET_DIR=target/repro-b cross build --locked --release --target ${{ matrix.target }}
      - name: Verify reproducible binary
        shell: bash
        run: |
          set -euo pipefail
          a=target/repro-a/${{ matrix.target }}/release/forformat
          b=target/repro-b/${{ matrix.target }}/release/forformat
          test "$(sha256sum "$a" | awk '{print $1}')" = "$(sha256sum "$b" | awk '{print $1}')"
      - name: Package deterministic release archive
        shell: bash
        run: |
          set -euo pipefail
          target=${{ matrix.target }}
          root=target/release-package
          directory="forformat-$target"
          archive="$root/$directory.tar.gz"
          check_archive="$root/$directory.repro.tar.gz"
          source_date_epoch=$(git log -1 --format=%ct)

          mkdir -p "$root/$directory"
          install -m 0755 "target/repro-a/$target/release/forformat" "$root/$directory/forformat"
          cp LICENSE LICENSE-THIRD-PARTY NOTICE README.md "$root/$directory/"

          make_archive() {
            output=$1
            tar \
              --sort=name \
              --mtime="@$source_date_epoch" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C "$root" \
              -cf - "$directory" | gzip -n > "$output"
          }

          make_archive "$archive"
          make_archive "$check_archive"
          cmp "$archive" "$check_archive"
          rm "$check_archive"
          (cd "$root" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release-${{ matrix.target }}
          path: |
            target/release-package/forformat-${{ matrix.target }}.tar.gz
            target/release-package/forformat-${{ matrix.target }}.tar.gz.sha256

  windows-artifact:
    name: Windows release artifact
    needs: checks
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C debuginfo=0 -C strip=debuginfo -C link-arg=/Brepro -C link-arg=/DEBUG:NONE
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
      - shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "target/repro-a"
          cargo build --locked --release --target x86_64-pc-windows-msvc
      - shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "target/repro-b"
          cargo build --locked --release --target x86_64-pc-windows-msvc
      - shell: pwsh
        run: |
          $a = (Get-FileHash target/repro-a/x86_64-pc-windows-msvc/release/forformat.exe -Algorithm SHA256).Hash
          $b = (Get-FileHash target/repro-b/x86_64-pc-windows-msvc/release/forformat.exe -Algorithm SHA256).Hash
          if ($a -ne $b) { throw "reproducible Windows build hash mismatch" }
          "$a  forformat.exe" | Out-File target/repro-a/x86_64-pc-windows-msvc/release/forformat.exe.sha256 -Encoding ascii
          Write-Output $a
      - uses: actions/upload-artifact@v7
        with:
          name: forformat-x86_64-pc-windows-msvc
          path: |
            target/repro-a/x86_64-pc-windows-msvc/release/forformat.exe
            target/repro-a/x86_64-pc-windows-msvc/release/forformat.exe.sha256

  artifact-verification:
    name: verify Linux release artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs: static-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-release-*
          path: artifacts
          merge-multiple: true
      - name: Verify artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          sidecars=$(find artifacts -maxdepth 1 -type f -name '*.sha256' -print)
          test -n "$sidecars"
          test "$(find artifacts -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 2
          while IFS= read -r sidecar; do
            (cd "$(dirname "$sidecar")" && sha256sum -c "$(basename "$sidecar")")
          done <<< "$sidecars"
      - name: Smoke-test x86_64 archive
        shell: bash
        run: |
          set -euo pipefail
          archive=artifacts/forformat-x86_64-unknown-linux-musl.tar.gz
          mkdir smoke
          tar -xzf "$archive" -C smoke
          binary=smoke/forformat-x86_64-unknown-linux-musl/forformat
          test -x "$binary"
          output=$("$binary" --version)
          case "$output" in
            *"${GITHUB_REF_NAME#v}"*) ;;
            *) echo "unexpected version output: $output" >&2; exit 1 ;;
          esac

  publish-linux-release:
    name: publish Linux GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: artifact-verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-release-*
          path: artifacts
          merge-multiple: true
      - name: Re-verify checksums before publishing
        shell: bash
        run: |
          set -euo pipefail
          for sidecar in artifacts/*.sha256; do
            (cd artifacts && sha256sum -c "$(basename "$sidecar")")
          done
      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*.tar.gz
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "forformat $GITHUB_REF_NAME"
          fi
