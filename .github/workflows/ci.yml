name: forformat checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      credentialed_signing:
        description: "Use signing/notarization credentials for this manual artifact test (does not publish)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/rust-checks.yml

  release:
    name: release and benchmark
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable@0.7.5
      - run: cargo auditable build --locked --release
      - name: Verify embedded dependency metadata
        shell: bash
        run: readelf -S target/release/forformat | grep -F .dep-v0
      - run: ./tools/check_cli_contract.sh target/release/forformat
      - run: ./tools/check_release.sh target/release/forformat | tee target/release-metrics.txt
      - run: ./tools/check_package.sh
      - run: cargo bench --locked --bench throughput
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-measurements
          path: target/release-metrics.txt

  target-checks:
    name: target check (${{ matrix.target }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - run: cargo check --locked --target ${{ matrix.target }} --all-targets

  static-artifacts:
    name: static Linux artifact (${{ matrix.target }})
    needs: checks
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable@0.7.5

      - name: Verify release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build reproducible binary A
        run: |
          CARGO_TARGET_DIR=target/repro-a \
            cargo auditable build \
            --locked \
            --release \
            --target ${{ matrix.target }}

      - name: Build reproducible binary B
        run: |
          CARGO_TARGET_DIR=target/repro-b \
            cargo auditable build \
            --locked \
            --release \
            --target ${{ matrix.target }}

      - name: Verify auditable and reproducible binary
        shell: bash
        run: |
          set -euo pipefail

          a=target/repro-a/${{ matrix.target }}/release/forformat
          b=target/repro-b/${{ matrix.target }}/release/forformat

          readelf -S "$a" | grep -F .dep-v0
          readelf -S "$b" | grep -F .dep-v0

          test "$(sha256sum "$a" | awk '{print $1}')" = \
               "$(sha256sum "$b" | awk '{print $1}')"

      - name: Package deterministic release archive
        shell: bash
        run: |
          set -euo pipefail

          target=${{ matrix.target }}
          root=target/release-package
          directory="forformat-$target"
          archive="$root/$directory.tar.gz"
          check_archive="$root/$directory.repro.tar.gz"
          source_date_epoch=$(git log -1 --format=%ct)

          mkdir -p "$root/$directory"

          install -m 0755 \
            "target/repro-a/$target/release/forformat" \
            "$root/$directory/forformat"

          cp \
            LICENSE \
            LICENSE-THIRD-PARTY \
            NOTICE \
            README.md \
            "$root/$directory/"

          make_archive() {
            output=$1

            tar \
              --sort=name \
              --mtime="@$source_date_epoch" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C "$root" \
              -cf - "$directory" |
              gzip -n > "$output"
          }

          make_archive "$archive"
          make_archive "$check_archive"

          cmp "$archive" "$check_archive"
          rm "$check_archive"

          (
            cd "$root"
            sha256sum "$(basename "$archive")" \
              > "$(basename "$archive").sha256"
          )

      - uses: actions/upload-artifact@v7
        with:
          name: linux-release-${{ matrix.target }}
          path: |
            target/release-package/forformat-${{ matrix.target }}.tar.gz
            target/release-package/forformat-${{ matrix.target }}.tar.gz.sha256

  windows-artifact:
    name: Windows release artifact
    needs: checks
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    env:
      RUSTFLAGS: >-
        -C debuginfo=0
        -C strip=debuginfo
        -C link-arg=/Brepro
        -C link-arg=/DEBUG:NONE
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build reproducible binary A
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "target/repro-a"
          cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Build reproducible binary B
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "target/repro-b"
          cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Verify reproducible Windows binary
        shell: pwsh
        run: |
          $a = (
            Get-FileHash `
              target/repro-a/x86_64-pc-windows-msvc/release/forformat.exe `
              -Algorithm SHA256
          ).Hash

          $b = (
            Get-FileHash `
              target/repro-b/x86_64-pc-windows-msvc/release/forformat.exe `
              -Algorithm SHA256
          ).Hash

          if ($a -ne $b) {
            throw "reproducible Windows build hash mismatch"
          }

          Write-Output $a

      - name: Authenticate to Google Cloud
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.credentialed_signing == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.credentialed_signing == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Sign Windows release binary
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.credentialed_signing == 'true'
        shell: pwsh
        env:
          GCP_KMS_KEY: ${{ secrets.GCP_KMS_KEY }}
          GCP_CERTIFICATE_CHAIN: ${{ secrets.GCP_CERTIFICATE_CHAIN }}
        run: |
          python tools/sign_windows_app.py `
            --install-cng `
            --file target/repro-a/x86_64-pc-windows-msvc/release/forformat.exe

      - name: Write Windows release checksum
        shell: pwsh
        run: |
          $artifact = "target/repro-a/x86_64-pc-windows-msvc/release/forformat.exe"
          $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()

          "$hash  forformat.exe" |
            Out-File `
              "$artifact.sha256" `
              -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: forformat-windows
          path: |
            target/repro-a/x86_64-pc-windows-msvc/release/forformat.exe
            target/repro-a/x86_64-pc-windows-msvc/release/forformat.exe.sha256

  macos-binaries:
    name: macOS reproducible binary (${{ matrix.target }})
    needs: checks
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            arch: x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build reproducible binary A
        shell: bash
        run: |
          CARGO_TARGET_DIR=target/repro-a \
            cargo build --locked --release --target ${{ matrix.target }}

      - name: Build reproducible binary B
        shell: bash
        run: |
          CARGO_TARGET_DIR=target/repro-b \
            cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify reproducible macOS binary
        shell: bash
        run: |
          set -euo pipefail

          target=${{ matrix.target }}
          a="target/repro-a/$target/release/forformat"
          b="target/repro-b/$target/release/forformat"
          artifact="target/repro-a/$target/release/forformat-$target"

          test "$(shasum -a 256 "$a" | awk '{print $1}')" = \
               "$(shasum -a 256 "$b" | awk '{print $1}')"
          test "$(lipo -archs "$a")" = "${{ matrix.arch }}"

          cp "$a" "$artifact"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-thin-${{ matrix.target }}
          path: target/repro-a/${{ matrix.target }}/release/forformat-${{ matrix.target }}

  macos-package:
    name: macOS universal installer
    needs: macos-binaries
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v8
        with:
          pattern: macos-thin-*
          path: target/macos-thin
          merge-multiple: true

      - name: Create universal macOS binary
        shell: bash
        run: |
          set -euo pipefail

          root=target/macos-package/root
          binary="$root/usr/local/bin/forformat"

          mkdir -p "$(dirname "$binary")"
          lipo -create \
            target/macos-thin/forformat-x86_64-apple-darwin \
            target/macos-thin/forformat-aarch64-apple-darwin \
            -output "$binary"
          chmod 0755 "$binary"

          lipo "$binary" -verify_arch x86_64 arm64

      - name: Package unsigned macOS installer
        if: github.event.inputs.credentialed_signing != 'true' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          pkgbuild \
            --root target/macos-package/root \
            --identifier com.cmbant.forformat \
            --version "$version" \
            --install-location / \
            --ownership recommended \
            target/macos-package/forformat-macos.pkg

          pkgutil --payload-files target/macos-package/forformat-macos.pkg |
            grep -Fx './usr/local/bin/forformat'

      - name: Sign, package, and notarize macOS installer
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.credentialed_signing == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER }}
        run: |
          set -euo pipefail

          root=target/macos-package/root
          binary="$root/usr/local/bin/forformat"
          pkg=target/macos-package/forformat-macos.pkg
          app_certificate=$(mktemp)
          installer_certificate=$(mktemp)
          keychain=$(mktemp).keychain-db
          api_key_dir=$(mktemp -d)
          notarization_result=$(mktemp).json
          notarization_stderr=$(mktemp)
          notarization_log=$(mktemp).json

          cleanup() {
            rm -f \
              "$app_certificate" \
              "$installer_certificate" \
              "$notarization_result" \
              "$notarization_stderr" \
              "$notarization_log"
            rm -rf "$api_key_dir"
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$app_certificate"
          printf '%s' "$MACOS_INSTALLER_CERTIFICATE" | base64 --decode > "$installer_certificate"

          security create-keychain -p "temporary-password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "temporary-password" "$keychain"
          security import "$app_certificate" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security import "$installer_certificate" \
            -P "$MACOS_INSTALLER_CERTIFICATE_PWD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "temporary-password" \
            "$keychain"

          app_identity=$(
            security find-identity -v -p codesigning "$keychain" |
              sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' |
              head -n 1
          )
          installer_identity=$(
            security find-identity -v "$keychain" |
              sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' |
              head -n 1
          )
          test -n "$app_identity"
          test -n "$installer_identity"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$app_identity" \
            "$binary"
          codesign --verify --strict --verbose=4 "$binary"
          lipo "$binary" -verify_arch x86_64 arm64

          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          pkgbuild \
            --root "$root" \
            --identifier com.cmbant.forformat \
            --version "$version" \
            --install-location / \
            --ownership recommended \
            --sign "$installer_identity" \
            --keychain "$keychain" \
            "$pkg"

          pkgutil --payload-files "$pkg" | grep -Fx './usr/local/bin/forformat'
          pkgutil --check-signature "$pkg"

          api_key="$api_key_dir/AuthKey_$APP_STORE_CONNECT_API_KEY.p8"
          printf '%s\n' "$APP_STORE_CONNECT_KEY" > "$api_key"
          openssl pkey -in "$api_key" -noout >/dev/null

          set +e
          xcrun notarytool submit "$pkg" \
            --key "$api_key" \
            --key-id "$APP_STORE_CONNECT_API_KEY" \
            --issuer "$APP_STORE_CONNECT_API_ISSUER" \
            --wait \
            --output-format json \
            > "$notarization_result" \
            2> "$notarization_stderr"
          notary_exit=$?
          set -e

          cat "$notarization_result"
          if [ -s "$notarization_stderr" ]; then
            cat "$notarization_stderr" >&2
          fi

          read_notary_field() {
            python3 -c \
              'import json, sys; value = json.load(open(sys.argv[1], encoding="utf-8")).get(sys.argv[2], ""); print(value or "")' \
              "$notarization_result" "$1" 2>/dev/null || true
          }

          submission_id=$(read_notary_field id)
          notarization_status=$(read_notary_field status)

          if [ "$notary_exit" -ne 0 ] || [ "$notarization_status" != "Accepted" ]; then
            echo "Notarization failed with status: ${notarization_status:-unknown}" >&2
            if [ -n "$submission_id" ]; then
              xcrun notarytool log "$submission_id" \
                --key "$api_key" \
                --key-id "$APP_STORE_CONNECT_API_KEY" \
                --issuer "$APP_STORE_CONNECT_API_ISSUER" \
                "$notarization_log" || true
              cat "$notarization_log" || true
            fi
            exit 1
          fi

          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"

      - name: Write macOS installer checksum
        shell: bash
        run: |
          set -euo pipefail
          (
            cd target/macos-package
            shasum -a 256 forformat-macos.pkg > forformat-macos.pkg.sha256
          )

      - uses: actions/upload-artifact@v7
        with:
          name: forformat-macos
          path: |
            target/macos-package/forformat-macos.pkg
            target/macos-package/forformat-macos.pkg.sha256

  artifact-verification:
    name: verify release artifacts
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [static-artifacts, windows-artifact, macos-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-release-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: forformat-windows
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: forformat-macos
          path: artifacts

      - name: Verify artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(artifacts/*.tar.gz)
          archive_sidecars=(artifacts/*.tar.gz.sha256)

          test "${#archives[@]}" -eq 2
          test "${#archive_sidecars[@]}" -eq 2

          for artifact in forformat.exe forformat-macos.pkg; do
            test -f "artifacts/$artifact"
            test -f "artifacts/$artifact.sha256"
          done

          (
            cd artifacts
            sha256sum -c ./*.sha256
          )

      - name: Smoke-test x86_64 archive
        shell: bash
        run: |
          set -euo pipefail

          archive=artifacts/forformat-x86_64-unknown-linux-musl.tar.gz
          mkdir -p smoke
          tar -xzf "$archive" -C smoke

          binary=smoke/forformat-x86_64-unknown-linux-musl/forformat
          test -x "$binary"

          expected_version=$(
            sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml |
              head -n 1
          )

          output=$("$binary" --version)

          case "$output" in
            *"$expected_version"*)
              ;;
            *)
              echo \
                "unexpected version output: $output; expected $expected_version" \
                >&2
              exit 1
              ;;
          esac

          readelf -S "$binary" | grep -F .dep-v0

  publish-github-release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: artifact-verification
    runs-on: ubuntu-latest

    # GitHub Settings -> Environments -> release controls this gate.
    environment:
      name: release

    # Never allow two publication jobs to mutate releases concurrently.
    concurrency:
      group: publish-github-release
      cancel-in-progress: false

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-release-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: forformat-windows
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: forformat-macos
          path: artifacts

      - name: Re-verify checksums before publishing
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(artifacts/*.tar.gz)
          archive_sidecars=(artifacts/*.tar.gz.sha256)

          test "${#archives[@]}" -eq 2
          test "${#archive_sidecars[@]}" -eq 2

          for artifact in forformat.exe forformat-macos.pkg; do
            test -f "artifacts/$artifact"
            test -f "artifacts/$artifact.sha256"
          done

          (
            cd artifacts
            sha256sum -c ./*.sha256
          )

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/forformat.exe
            artifacts/forformat-macos.pkg

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload \
              "$GITHUB_REF_NAME" \
              artifacts/* \
              --clobber
          else
            gh release create \
              "$GITHUB_REF_NAME" \
              artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "forformat $GITHUB_REF_NAME"
          fi

  publish-pypi:
    name: publish Python package to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: artifact-verification
    uses: ./.github/workflows/pypi.yml
    permissions:
      contents: read
      id-token: write