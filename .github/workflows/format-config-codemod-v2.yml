name: FormatConfig staging codemod v2

on:
  push:
    branches:
      - refactor/format-config-staging

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/format-config-staging
          fetch-depth: 0

      - name: Apply FormatConfig cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          # ------------------------------------------------------------------
          # FormatConfig: collapse paired bool/value state into one newtype.
          # ------------------------------------------------------------------
          path = Path('src/config.rs')
          text = path.read_text()

          insert_before = '/// A `-D NAME[=VALUE]` definition.'
          assert insert_before in text
          feature_level = '''/// Numeric setting whose level also acts as its enable switch.
          ///
          /// Zero disables the feature; positive values enable it while retaining the
          /// exact optional numeric CLI value. Keeping both facts in one value makes
          /// contradictory enabled/value states unrepresentable.
          #[derive(Debug, Clone, Copy, Default, PartialEq, Eq)]
          pub struct FeatureLevel(usize);

          impl FeatureLevel {
              pub const fn new(value: usize) -> Self {
                  Self(value)
              }

              pub const fn enabled(self) -> bool {
                  self.0 != 0
              }

              pub const fn value(self) -> usize {
                  self.0
              }
          }

          impl From<usize> for FeatureLevel {
              fn from(value: usize) -> Self {
                  Self::new(value)
              }
          }

          impl From<bool> for FeatureLevel {
              fn from(enabled: bool) -> Self {
                  Self::new(enabled as usize)
              }
          }

          '''
          text = text.replace(insert_before, feature_level + insert_before, 1)

          text, n = re.subn(
              r'''    /// Whether parenthesis alignment is enabled\.  `align_paren_value` keeps\n    /// the optional numeric CLI value without breaking boolean API callers\.\n    pub align_paren: bool,\n    pub align_paren_value: usize,\n''',
              '''    /// Parenthesis-alignment level; zero disables the feature.\n    pub align_paren: FeatureLevel,\n''',
              text,
              count=1,
          )
          assert n == 1, 'FormatConfig align_paren fields did not match'

          text, n = re.subn(
              r'''    /// Whether redundant-whitespace reduction is enabled\.  The numeric mode\n    /// is retained in `ws_remred_value` for the optional CLI contract\.\n    pub ws_remred: bool,\n    pub ws_remred_value: usize,\n    pub last_indent: bool,\n    pub last_usable: bool,\n''',
              '''    /// Redundant-whitespace-reduction level; zero disables the feature.\n    pub ws_remred: FeatureLevel,\n''',
              text,
              count=1,
          )
          assert n == 1, 'FormatConfig ws/query fields did not match'

          text, n = re.subn(
              r'            align_paren: false,\n            align_paren_value: 0,\n',
              '            align_paren: FeatureLevel::default(),\n',
              text,
              count=1,
          )
          assert n == 1, 'FormatConfig align_paren default did not match'
          text, n = re.subn(
              r'            ws_remred: false,\n            ws_remred_value: 0,\n            last_indent: false,\n            last_usable: false,\n',
              '            ws_remred: FeatureLevel::default(),\n',
              text,
              count=1,
          )
          assert n == 1, 'FormatConfig ws/query defaults did not match'
          write(path, text)

          # CLI setting application now writes one canonical state.
          path = Path('src/cli/settings.rs')
          text = path.read_text()
          text = text.replace(
              'config::{FormatConfig, FormatMode, FortranStandard, KeywordCase, MacroDefine},',
              'config::{FeatureLevel, FormatConfig, FormatMode, FortranStandard, KeywordCase, MacroDefine},',
              1,
          )
          start = text.index('            Self::AlignParen(value) => {')
          end = text.index('            Self::AlignDeclarations(value)', start)
          text = text[:start] + '''            Self::AlignParen(value) => config.align_paren = FeatureLevel::new(*value),
              Self::WhitespaceReduction(value) => config.ws_remred = FeatureLevel::new(*value),
          ''' + text[end:]
          write(path, text)

          # Production readers ask the newtype the one question they need.
          path = Path('src/format/planner.rs')
          text = path.read_text()
          text = text.replace(
              'align: !hollerith && (config.align_paren || config.align_paren_value != 0),',
              'align: !hollerith && config.align_paren.enabled(),',
          )
          text = text.replace(
              'config.ws_remred || config.ws_remred_value != 0',
              'config.ws_remred.enabled()',
          )
          write(path, text)

          path = Path('src/format/emitter.rs')
          text = path.read_text().replace(
              'remred: config.ws_remred || config.ws_remred_value != 0,',
              'remred: config.ws_remred.enabled(),',
          )
          write(path, text)

          # ------------------------------------------------------------------
          # Rust call sites: use the old numeric member as the source of truth.
          # ------------------------------------------------------------------
          def collapse_pairs(path):
              text = path.read_text()
              for field, value_field in [
                  ('align_paren', 'align_paren_value'),
                  ('ws_remred', 'ws_remred_value'),
              ]:
                  # Adjacent struct fields, bool first.
                  pattern = re.compile(
                      rf'(?m)^(?P<i>[ \t]*){field}:\s*[^,\n]+,\n(?P=i){value_field}:\s*(?P<v>[^,\n]+),'
                  )
                  text = pattern.sub(
                      lambda m: f"{m.group('i')}{field}: ({m.group('v').strip()}).into(),",
                      text,
                  )

                  # Adjacent struct fields, numeric first.
                  pattern = re.compile(
                      rf'(?m)^(?P<i>[ \t]*){value_field}:\s*(?P<v>[^,\n]+),\n(?P=i){field}:\s*[^,\n]+,'
                  )
                  text = pattern.sub(
                      lambda m: f"{m.group('i')}{field}: ({m.group('v').strip()}).into(),",
                      text,
                  )

                  # Shorthand numeric struct field followed by bool (fuzz target).
                  pattern = re.compile(
                      rf'(?m)^(?P<i>[ \t]*){value_field},\n(?P=i){field}:\s*[^,\n]+,'
                  )
                  text = pattern.sub(
                      lambda m: f"{m.group('i')}{field}: {value_field}.into(),",
                      text,
                  )

                  # Adjacent assignments, bool first.
                  pattern = re.compile(
                      rf'(?m)^(?P<i>[ \t]*)(?P<obj>[A-Za-z_][A-Za-z0-9_\.]*)\.{field}\s*=\s*[^;]+;\n(?P=i)(?P=obj)\.{value_field}\s*=\s*(?P<v>[^;]+);'
                  )
                  text = pattern.sub(
                      lambda m: f"{m.group('i')}{m.group('obj')}.{field} = ({m.group('v').strip()}).into();",
                      text,
                  )

                  # Adjacent assignments, numeric first.
                  pattern = re.compile(
                      rf'(?m)^(?P<i>[ \t]*)(?P<obj>[A-Za-z_][A-Za-z0-9_\.]*)\.{value_field}\s*=\s*(?P<v>[^;]+);\n(?P=i)(?P=obj)\.{field}\s*=\s*[^;]+;'
                  )
                  text = pattern.sub(
                      lambda m: f"{m.group('i')}{m.group('obj')}.{field} = ({m.group('v').strip()}).into();",
                      text,
                  )

                  # Numeric reads in tests.
                  text = text.replace(f'.{value_field}', f'.{field}.value()')

                  # Construction sites that only set the historical boolean.
                  pattern = re.compile(
                      rf'(?m)^(?P<i>[ \t]*){field}:\s*(?P<v>true|false|align),$'
                  )
                  text = pattern.sub(
                      lambda m: f"{m.group('i')}{field}: ({m.group('v')}).into(),",
                      text,
                  )
                  pattern = re.compile(
                      rf'(?m)^(?P<i>[ \t]*)(?P<obj>[A-Za-z_][A-Za-z0-9_\.]*)\.{field}\s*=\s*(?P<v>true|false);$'
                  )
                  text = pattern.sub(
                      lambda m: f"{m.group('i')}{m.group('obj')}.{field} = ({m.group('v')}).into();",
                      text,
                  )
              path.write_text(text)

          for rust_file in Path('.').rglob('*.rs'):
              if rust_file.as_posix() != 'src/config.rs':
                  collapse_pairs(rust_file)

          # Boolean assertions become explicit newtype queries.
          path = Path('src/cli/tests.rs')
          text = path.read_text()
          text = text.replace('.align_paren);', '.align_paren.enabled());')
          text = text.replace('.ws_remred);', '.ws_remred.enabled());')
          write(path, text)

          # ------------------------------------------------------------------
          # Query action state: keep it out of FormatConfig entirely.
          # ------------------------------------------------------------------
          path = Path('src/cli.rs')
          text = path.read_text()
          anchor = '''/// Parsed command-line state. Formatting remains configured by
          /// [`FormatConfig`]; file/project policy lives here.
          '''
          assert anchor in text
          query_enum = '''/// Metadata-only indentation query requested by the CLI.
          ///
          /// `Both` preserves the historical combined-option behavior: the CLI
          /// reports `last_usable`, which previously won the engine output branch.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum IndentQuery {
              LastIndent,
              LastUsable,
              Both,
          }

          '''
          text = text.replace(anchor, query_enum + anchor, 1)
          text = text.replace(
              '    pub query_format: bool,\n',
              '    pub query_format: bool,\n    pub indent_query: Option<IndentQuery>,\n',
              1,
          )
          write(path, text)

          path = Path('src/cli/draft.rs')
          text = path.read_text()
          text = text.replace('    ContextPath, Invocation,\n', '    ContextPath, IndentQuery, Invocation,\n', 1)
          enum_start = text.index('#[derive(Debug, Clone, Copy, PartialEq, Eq)]\nenum IndentQuery {')
          enum_end = text.index('\n}\n\n', enum_start) + len('\n}\n\n')
          text = text[:enum_start] + text[enum_end:]
          text = text.replace(
              'pub(super) fn finish(mut self, mut config: FormatConfig) -> Result<Invocation, FormatError> {',
              'pub(super) fn finish(mut self, config: FormatConfig) -> Result<Invocation, FormatError> {',
              1,
          )
          block_start = text.index(
              '        let (stdout, check, diff, show_files, query_format, last_indent, last_usable)'
          )
          end_marker = '        config.last_usable = last_usable;\n'
          block_end = text.index(end_marker, block_start) + len(end_marker)
          replacement = '''        let (stdout, check, diff, show_files, query_format, indent_query) = match action {
              Action::Rewrite => (false, false, false, false, false, None),
              Action::Stdout => (true, false, false, false, false, None),
              Action::Check => (false, true, false, false, false, None),
              Action::Diff { check } => (false, check, true, false, false, None),
              Action::ShowFiles => (false, false, false, true, false, None),
              Action::QueryFormat => (false, false, false, false, true, None),
              Action::IndentQuery(query) => (false, false, false, false, false, Some(query)),
          };
          '''
          text = text[:block_start] + replacement + text[block_end:]
          text = text.replace(
              '            query_format,\n            isolated,\n',
              '            query_format,\n            indent_query,\n            isolated,\n',
              1,
          )
          write(path, text)

          path = Path('src/cli/draft/tests.rs')
          text = path.read_text()
          text = text.replace('cli::{parse, Command},', 'cli::{parse, Command, IndentQuery},', 1)
          text = text.replace(
              '''    assert!(invocation.config.last_indent);
              assert!(invocation.config.last_usable);
          ''',
              '''    assert_eq!(invocation.indent_query, Some(IndentQuery::Both));
          ''',
              1,
          )
          write(path, text)

          path = Path('src/cli/tests.rs')
          text = path.read_text().replace(
              '''    assert!(invocation.config.last_indent);
              assert!(invocation.config.last_usable);
          ''',
              '''    assert_eq!(invocation.indent_query, Some(super::IndentQuery::Both));
          ''',
              1,
          )
          write(path, text)

          path = Path('src/cli/parse.rs')
          text = path.read_text()
          block_start = text.index('        // Query modes are CLI-only action state, not formatter configuration,')
          block_end_marker = '        invocation.config = format;\n'
          block_end = text.index(block_end_marker, block_start) + len(block_end_marker)
          text = text[:block_start] + '''        // Query modes stay on Invocation; replacing the preliminary
              // formatter config therefore cannot erase action state.
              invocation.config = format;
          ''' + text[block_end:]
          write(path, text)

          # The engine's ordinary formatter always emits. Metadata-only querying
          # is a separate planner pass and therefore cannot suppress formatting.
          path = Path('src/format/engine.rs')
          text = path.read_text()
          block_start = text.index('pub fn format_buffer')
          block_end = text.index('\n/// Write the physical lines of one planned group.', block_start)
          replacement = '''pub fn query(source: &[u8], config: &FormatConfig) -> Result<FormatMeta, FormatError> {
              let buf = SourceBuffer::new(source)?;
              query_buffer(&buf, config)
          }

          fn query_buffer<B: AsRef<[u8]>>(
              buf: &SourceBuffer<B>,
              config: &FormatConfig,
          ) -> Result<FormatMeta, FormatError> {
              if buf.bytes.as_ref().is_empty() {
                  return Ok(FormatMeta {
                      last_indent: 0,
                      last_usable: 1,
                      declines: Vec::new(),
                  });
              }
              let mut planner = Planner::new(config);
              let mut last_indent = 0;
              let mut last_usable = 1;
              LogicalGroup::visit(buf, |group| {
                  let plan = planner.plan(buf, &group, config);
                  if let Some(value) = plan.last_indent {
                      last_indent = value;
                  }
                  if let Some(value) = plan.last_usable {
                      last_usable = value;
                  }
                  Ok(())
              })?;
              Ok(FormatMeta {
                  last_indent,
                  last_usable,
                  declines: Vec::new(),
              })
          }

          pub fn format_buffer<B: AsRef<[u8]>, W: Write>(
              buf: &SourceBuffer<B>,
              config: &FormatConfig,
              out: &mut W,
          ) -> Result<FormatMeta, FormatError> {
              if buf.bytes.as_ref().is_empty() {
                  return Ok(FormatMeta {
                      last_indent: 0,
                      last_usable: 1,
                      declines: Vec::new(),
                  });
              }
              let mut planner = Planner::new(config);
              let mut last_indent = 0;
              let mut last_usable = 1;
              LogicalGroup::visit(buf, |group| {
                  let plan = planner.plan(buf, &group, config);
                  if let Some(value) = plan.last_indent {
                      last_indent = value;
                  }
                  if let Some(value) = plan.last_usable {
                      last_usable = value;
                  }
                  emit_group(buf, &plan, config, out)
              })?;
              Ok(FormatMeta {
                  last_indent,
                  last_usable,
                  declines: Vec::new(),
              })
          }
          '''
          text = text[:block_start] + replacement + text[block_end:]
          write(path, text)

          path = Path('src/io/report.rs')
          text = path.read_text()
          old = '''    !invocation.force_free_input
              && !invocation.config.last_indent
              && !invocation.config.last_usable
          '''
          assert old in text
          text = text.replace(
              old,
              '''    !invocation.force_free_input
              && invocation.indent_query.is_none()
          ''',
              1,
          )
          write(path, text)

          path = Path('src/io/mod.rs')
          text = path.read_text()
          text = text.replace('    cli::Invocation,\n', '    cli::{IndentQuery, Invocation},\n', 1)
          anchor = "fn source_form_name(form: SourceForm) -> &'static str {\n"
          assert anchor in text
          query_fn = '''fn execute_indent_query(
              invocation: &Invocation,
              query: IndentQuery,
          ) -> Result<i32, WorkflowError> {
              let mut source = Vec::new();
              io::stdin().read_to_end(&mut source)?;
              let meta = crate::format::engine::query(&source, &invocation.config)?;
              let value = match query {
                  IndentQuery::LastIndent => meta.last_indent,
                  IndentQuery::LastUsable | IndentQuery::Both => meta.last_usable,
              };
              write_all_stdout(format!("{value}\\n").as_bytes())?;
              Ok(0)
          }

          '''
          text = text.replace(anchor, query_fn + anchor, 1)
          execute_anchor = '''    if invocation.query_format {
              return execute_query_format(invocation);
          }
          '''
          assert execute_anchor in text
          text = text.replace(
              execute_anchor,
              execute_anchor + '''    if let Some(query) = invocation.indent_query {
              return execute_indent_query(&invocation, query);
          }
          ''',
              1,
          )
          write(path, text)

          # Re-export the new public value type and replace old library query tests
          # with tests of the dedicated metadata path.
          path = Path('src/lib.rs')
          text = path.read_text()
          text = text.replace(
              '    ConstructIndents, FormatConfig, FormatMode, FortranStandard, KeywordCase, MacroDefine,\n',
              '    ConstructIndents, FeatureLevel, FormatConfig, FormatMode, FortranStandard, KeywordCase,\n    MacroDefine,\n',
              1,
          )
          test_start = text.index('    #[test]\n    fn empty_queries_have_stable_results()')
          test_end = text.index(
              '    #[test]\n    fn preprocessor_continuations_keep_their_generation_and_spelling()',
              test_start,
          )
          query_tests = '''    #[test]
              fn indentation_query_metadata_is_stable() {
                  let config = indent_only_config();
                  let empty = crate::format::engine::query(b"", &config).unwrap();
                  assert_eq!((empty.last_indent, empty.last_usable), (0, 1));

                  let meta = crate::format::engine::query(b"program p\\nx=1\\n", &config).unwrap();
                  assert_eq!((meta.last_indent, meta.last_usable), (3, 2));
              }

          '''
          text = text[:test_start] + query_tests + text[test_end:]
          write(path, text)

          # End-to-end CLI coverage pins both individual queries, combined
          # precedence, and empty-input defaults.
          path = Path('tests/io_workflow.rs')
          text = path.read_text()
          if 'fn indentation_queries_emit_only_metadata_from_stdin()' not in text:
              text += r'''

          #[test]
          fn indentation_queries_emit_only_metadata_from_stdin() {
              let repo = temp_repo();
              let source = b"program p\nx=1\n";

              let indent = run_stdin(&repo, &["-lastindent"], source);
              assert_eq!(indent.status.code(), Some(0));
              assert_eq!(indent.stdout, b"3\n");

              let usable = run_stdin(&repo, &["--last-usable"], source);
              assert_eq!(usable.status.code(), Some(0));
              assert_eq!(usable.stdout, b"2\n");

              let both = run_stdin(&repo, &["-lastindent", "-lastusable"], source);
              assert_eq!(both.status.code(), Some(0));
              assert_eq!(both.stdout, b"2\n");

              let empty_indent = run_stdin(&repo, &["-lastindent"], b"");
              assert_eq!(empty_indent.stdout, b"0\n");
              let empty_usable = run_stdin(&repo, &["-lastusable"], b"");
              assert_eq!(empty_usable.stdout, b"1\n");

              let _ = fs::remove_dir_all(repo);
          }
          '''
          write(path, text)

          # Catch stale representations before asking rustc to diagnose them.
          offenders = []
          for rust_file in Path('.').rglob('*.rs'):
              body = rust_file.read_text()
              for needle in [
                  '.align_paren_value', '.ws_remred_value',
                  'config.last_indent', 'config.last_usable',
                  'align_paren_value:', 'ws_remred_value:',
                  'last_indent: true', 'last_usable: true',
              ]:
                  if needle in body:
                      offenders.append(f'{rust_file}: {needle}')
          if offenders:
              raise SystemExit('unconverted FormatConfig state:\n' + '\n'.join(offenders))
          PY

      - name: Format
        run: cargo fmt --all

      - name: Check
        run: cargo check --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

      - name: Commit validated staging tree
        shell: bash
        run: |
          rm -f .github/workflows/format-config-codemod.yml
          rm -f .github/workflows/format-config-codemod-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage validated FormatConfig cleanup'
          git push origin HEAD:refactor/format-config-staging
