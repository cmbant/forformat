name: Apply review fixes

on:
  push:
    branches: [scope-module-visibility]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .review-fix-00 .review-fix-01 .review-fix-02 .review-fix-03 > /tmp/review-fix.patch
          git apply --check /tmp/review-fix.patch
          git apply /tmp/review-fix.patch
          rm .review-fix-00 .review-fix-01 .review-fix-02 .review-fix-03
          rm .github/workflows/apply-review-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix scoped visibility review findings"
          git push origin HEAD:${GITHUB_REF_NAME}
