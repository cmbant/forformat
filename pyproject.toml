[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forformat"
dynamic = ["version"]
description = "A standalone free-form Fortran formatter"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [{ name = "forformat contributors" }]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
forformat = "forformat_runner.launcher:main"

[tool.setuptools]
packages = ["forformat_runner"]

[tool.setuptools.package-data]
forformat_runner = ["bin/*"]
