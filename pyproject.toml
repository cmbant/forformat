[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forformat"
dynamic = ["version"]
description = "A standalone free-form Fortran formatter"
readme = "README_PYPI.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [{ name = "Antony Lewis" }]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
forformat = "forformat_runner.launcher:main"

[project.urls]
Homepage = "https://github.com/cmbant/forformat"

[tool.setuptools]
packages = ["forformat", "forformat_runner"]

[tool.setuptools.package-data]
forformat_runner = ["bin/*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
ignore = ["UP045"]
